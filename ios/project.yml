# XcodeGen 프로젝트 정의 — `xcodegen generate`로 JARVIS.xcodeproj를 생성한다.
# 설치: brew install xcodegen
# .xcodeproj는 생성물이므로 Git에 커밋하지 않는다 (병합 충돌 방지).
name: JARVIS

options:
  bundleIdPrefix: com.example.jarvis   # TODO(사용자): 본인 Apple 개발자 계정의 번들 ID 접두사로 변경
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  JarvisCore:
    path: Packages/JarvisCore

targets:
  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: JarvisApp
    dependencies:
      - package: JarvisCore
    info:
      path: JarvisApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # HTTPS만 허용. 개발 중 Mac에서 띄운 로컬 백엔드(localhost/사설망) 접속만 예외.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 같은 네트워크에서 실행 중인 JARVIS 개발 서버에 접속하기 위해 로컬 네트워크를 사용합니다.
        # 마이크·음성 인식·캘린더 등 권한 문구는 해당 기능을 구현하는 단계(PHASE 3·4)에서 추가한다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jarvis.app   # TODO(사용자): 변경
        PRODUCT_NAME: JARVIS
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""   # TODO(사용자): Xcode > Signing에서 팀 선택 또는 Team ID 입력

  JARVISTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JarvisAppTests
    dependencies:
      - target: JARVIS
      - package: JarvisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jarvis.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/JARVIS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/JARVIS
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  JARVIS:
    build:
      targets:
        JARVIS: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - JARVISTests
        - package: JarvisCore/JarvisCoreTests
    archive:
      config: Release
